[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "page-line-editor"
version = "0.1.0a2"
description = "Offline PAGE XML transcription and geometry editor"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing",
]
keywords = ["arabic", "page-xml", "pyside6", "transcription"]
dependencies = [
  "lxml>=5.3,<7",
  "python-docx>=1.1,<2",
  "PySide6>=6.8,<6.11",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/Yawsom/page-line-editor"
Issues = "https://github.com/Yawsom/page-line-editor/issues"

[project.scripts]
page-line-editor = "page_line_editor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
page_line_editor = ["pagexml/schemas/*.xsd", "ui/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
